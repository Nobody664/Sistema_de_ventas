<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Centro de tienda · Prototipo de arquitectura</title>
    <style>
      :root {
        --bg: #f6f4ef;
        --surface: #fff;
        --ink: #202924;
        --muted: #5d6964;
        --line: #dce0d8;
        --accent: #134e4a;
        --tint: #edf5f0;
        --warning: #8a4b0e;
        --warning-bg: #fff4df;
        --radius: 18px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.5 "IBM Plex Sans",
          system-ui,
          sans-serif;
      }
      body[data-theme="dark"] {
        --bg: #0b1220;
        --surface: #111c2c;
        --ink: #f0f5f2;
        --muted: #b5c4c2;
        --line: #344352;
        --accent: #5eead4;
        --tint: #163a3b;
        --warning: #fed7aa;
        --warning-bg: #403326;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button,
      select {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
      }
      button,
      a,
      input,
      select,
      textarea {
        outline-offset: 3px;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--accent);
      }
      a {
        color: var(--accent);
      }
      button {
        border: 0;
        background: none;
      }
      svg {
        width: 19px;
        height: 19px;
        flex-shrink: 0;
        vertical-align: middle;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1,
      h2,
      h3 {
        letter-spacing: -0.025em;
      }
      h1 {
        font-size: 32px;
        font-weight: 600;
        line-height: 1.2;
      }
      h2 {
        font-size: 18px;
        font-weight: 600;
      }
      h3 {
        font-size: 15px;
        font-weight: 600;
      }
      small,
      .muted {
        color: var(--muted);
      }
      small {
        font-size: 12px;
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--accent);
      }
      .app {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
        min-height: 100vh;
      }
      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        padding: 28px 18px;
        border-right: 1px solid var(--line);
        background: var(--surface);
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 10px 28px;
      }
      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        background: #134e4a;
        color: white;
        display: grid;
        place-items: center;
      }
      .brand strong {
        display: block;
        font-size: 16px;
      }
      .brand small {
        font-size: 11px;
      }
      .nav-group {
        margin: 16px 12px 8px;
        font-size: 9px;
        letter-spacing: 0.16em;
        color: var(--muted);
        text-transform: uppercase;
      }
      .nav-link {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 45px;
        text-align: left;
        padding: 11px 13px;
        margin: 3px 0;
        border-radius: 11px;
        color: var(--muted);
        font-size: 13px;
      }
      .nav-link:hover {
        background: var(--bg);
        color: var(--ink);
      }
      .nav-link[aria-current="page"] {
        background: var(--tint);
        color: var(--accent);
        font-weight: 600;
      }
      .nav-link span:nth-child(2) {
        flex: 1;
      }
      .nav-count {
        font-size: 10px;
        padding: 2px 7px;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .sidebar-footer {
        margin-top: auto;
        padding: 20px 10px 0;
        border-top: 1px solid var(--line);
        font-size: 12px;
      }
      .workspace {
        min-width: 0;
      }
      .topbar {
        height: 80px;
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 34px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .topbar-name {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13px;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .icon-button {
        min-width: 42px;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 11px;
        display: grid;
        place-items: center;
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--tint);
        display: grid;
        place-items: center;
        font-size: 11px;
        color: var(--accent);
        font-weight: 700;
      }
      .demo-banner {
        padding: 10px 34px;
        border-bottom: 1px solid var(--line);
        font-size: 11px;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .demo-banner strong {
        font-weight: 600;
        color: var(--accent);
      }
      main {
        max-width: 1600px;
        margin: auto;
        padding: 34px;
      }
      .page-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 28px;
      }
      .page-heading h1 {
        margin: 8px 0;
      }
      .heading-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        min-height: 42px;
        padding: 10px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .button.primary {
        background: #134e4a;
        color: #fff;
        border-color: #134e4a;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        min-width: 0;
        overflow: hidden;
      }
      .panel-pad {
        padding: 24px;
      }
      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 20px;
      }
      .section-heading small {
        font-size: 11px;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 26px;
      }
      .metric {
        padding: 22px;
      }
      .metric-label {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .metric-value {
        font-size: 29px;
        letter-spacing: -0.04em;
        font-weight: 600;
        margin: 12px 0 5px;
        font-variant-numeric: tabular-nums;
      }
      .metric small {
        font-size: 10px;
      }
      .dashboard-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.8fr) minmax(260px, 1fr);
        gap: 24px;
      }
      .priority-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 0;
        border-top: 1px solid var(--line);
      }
      .priority-row > div:nth-child(2) {
        flex: 1;
        min-width: 0;
      }
      .priority-row strong {
        display: block;
        font-size: 13px;
      }
      .priority-row p {
        font-size: 11px;
        color: var(--muted);
        margin-top: 3px;
      }
      .priority-icon {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        background: var(--warning-bg);
        color: var(--warning);
        display: grid;
        place-items: center;
      }
      .priority-row .button {
        min-height: 36px;
        padding: 7px 11px;
      }
      .timeline {
        padding: 0;
        list-style: none;
        margin: 0;
      }
      .timeline li {
        position: relative;
        padding: 0 0 22px 22px;
        border-left: 1px solid var(--line);
        margin-left: 5px;
        font-size: 12px;
      }
      .timeline li:before {
        content: "";
        position: absolute;
        width: 7px;
        height: 7px;
        left: -4px;
        top: 5px;
        background: var(--accent);
        border-radius: 50%;
      }
      .timeline small {
        display: block;
        margin-top: 5px;
        font-size: 10px;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .search {
        flex: 1;
        min-width: 180px;
        position: relative;
      }
      .search svg {
        position: absolute;
        left: 14px;
        top: 13px;
        color: var(--muted);
      }
      .search input {
        padding-left: 44px;
      }
      input,
      select,
      textarea {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        padding: 12px 14px;
        min-height: 44px;
        max-width: 100%;
        width: 100%;
      }
      .toolbar select {
        width: auto;
        max-width: 230px;
      }
      .segmented {
        display: inline-flex;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 3px;
        gap: 3px;
      }
      .segmented button {
        min-height: 35px;
        padding: 8px 12px;
        font-size: 12px;
        border-radius: 7px;
        color: var(--muted);
      }
      .segmented button[aria-pressed="true"] {
        background: var(--tint);
        color: var(--accent);
        font-weight: 600;
      }
      .table-scroll {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        text-align: left;
        width: 100%;
        font-size: 12px;
        white-space: nowrap;
      }
      th {
        font-size: 10px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        padding: 17px 20px;
        border-bottom: 1px solid var(--line);
      }
      td {
        padding: 19px 20px;
        border-bottom: 1px solid var(--line);
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      .table-link {
        padding: 0;
        color: var(--accent);
        font-weight: 600;
        text-align: left;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        font-weight: 500;
        background: var(--tint);
        color: var(--accent);
        border-radius: 999px;
        padding: 5px 9px;
      }
      .badge.warning {
        background: var(--warning-bg);
        color: var(--warning);
      }
      .badge.neutral {
        color: var(--muted);
        background: var(--bg);
      }
      .result-meta {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }
      .board-column {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 13px;
        min-height: 310px;
      }
      .board-column h3 {
        font-size: 11px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 2px 0 14px;
      }
      .order-card {
        display: block;
        text-align: left;
        background: var(--surface);
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 10px;
      }
      .order-card:hover {
        border-color: var(--accent);
      }
      .order-card strong {
        font-size: 12px;
      }
      .order-card .badge {
        margin: 12px 0;
      }
      .order-card p {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
        color: var(--muted);
      }
      .order-card b {
        color: var(--ink);
        font-weight: 600;
      }
      .empty {
        padding: 36px 16px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }
      .settings-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 24px;
      }
      .field {
        display: grid;
        gap: 7px;
        margin-bottom: 20px;
        font-size: 12px;
      }
      .field > label {
        font-weight: 600;
      }
      .field small {
        font-size: 10px;
      }
      .option {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 18px;
        margin: 12px 0;
      }
      .option > div {
        flex: 1;
      }
      .option h3 {
        font-size: 13px;
      }
      .option p {
        font-size: 12px;
        color: var(--muted);
        margin: 6px 0;
      }
      .option b {
        font-size: 12px;
      }
      .catalog-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }
      .product-placeholder {
        height: 150px;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--muted);
      }
      .product-placeholder svg {
        width: 42px;
        height: 42px;
      }
      .product-meta {
        padding: 20px;
      }
      .product-meta h3 {
        margin-bottom: 10px;
      }
      .product-meta > div {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .preview {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
      }
      .preview-top {
        padding: 17px 22px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        font-weight: 600;
        font-size: 13px;
      }
      .preview-body {
        padding: 36px 24px;
      }
      .preview-body h2 {
        font-size: 32px;
        line-height: 1.15;
        max-width: 250px;
        margin: 16px 0;
      }
      .preview-body p {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.8;
      }
      .preview-products {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 30px;
      }
      .preview-product {
        background: var(--surface);
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 13px;
        font-size: 12px;
      }
      .preview-product svg {
        display: block;
        margin: 6px auto 24px;
        width: 34px;
        height: 34px;
      }
      .preview-product b {
        display: block;
        margin-top: 8px;
      }
      .preview.mobile {
        max-width: 370px;
        margin: auto;
      }
      .preview-note {
        font-size: 11px;
        color: var(--muted);
        margin: 15px 0;
      }
      .status-line {
        min-height: 20px;
        font-size: 12px;
        color: var(--accent);
        margin-top: 14px;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-size: 10px;
        color: var(--muted);
        padding-top: 26px;
        margin-top: 28px;
        border-top: 1px solid var(--line);
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--surface);
        color: var(--ink);
        padding: 0;
        width: min(760px, calc(100% - 28px));
        max-height: 90vh;
      }
      dialog::backdrop {
        background: #081b1ba6;
      }
      .dialog-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 22px 26px;
        border-bottom: 1px solid var(--line);
      }
      .dialog-body {
        padding: 26px;
      }
      .detail-grid {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 24px;
        margin: 24px 0;
      }
      .note-list {
        padding-left: 18px;
        font-size: 12px;
      }
      .dialog-body textarea {
        min-height: 90px;
        resize: vertical;
      }
      .bars {
        display: flex;
        align-items: flex-end;
        gap: 16px;
        height: 110px;
        margin: 22px 0 10px;
      }
      .bar {
        flex: 1;
        background: var(--tint);
        border-top: 3px solid var(--accent);
        border-radius: 5px 5px 0 0;
        min-width: 12px;
      }
      .menu-button {
        display: none;
      }
      #mobile-backdrop {
        display: none;
      }
      .sr-only {
        position: absolute;
        clip: rect(0, 0, 0, 0);
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
      @media (min-width: 1600px) {
        main {
          padding: 42px 54px;
        }
      }
      @media (max-width: 1150px) {
        .metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .dashboard-grid {
          grid-template-columns: 1fr;
        }
        .board {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .catalog-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 800px) {
        .app {
          grid-template-columns: minmax(0, 1fr);
        }
        .sidebar {
          position: fixed;
          z-index: 30;
          left: 0;
          top: 0;
          width: 260px;
          transform: translateX(-100%);
          overflow-y: auto;
        }
        .sidebar.open {
          transform: translateX(0);
        }
        #mobile-backdrop.open {
          display: block;
          position: fixed;
          inset: 0;
          background: #081b1b99;
          z-index: 25;
        }
        .menu-button {
          display: grid;
        }
        .topbar {
          height: 68px;
          padding: 0 18px;
        }
        .demo-banner {
          padding: 10px 18px;
        }
        .demo-banner a {
          display: none;
        }
        main {
          padding: 24px 18px;
        }
        .page-heading {
          align-items: flex-start;
          flex-direction: column;
          gap: 18px;
        }
        h1 {
          font-size: 28px;
        }
        .settings-grid {
          grid-template-columns: 1fr;
        }
        .detail-grid {
          grid-template-columns: 1fr;
        }
        .topbar-name .dot,
        .topbar-name > span {
          display: none;
        }
        .tools .avatar {
          display: none;
        }
        .footer {
          flex-direction: column;
          gap: 6px;
        }
        .metrics {
          gap: 12px;
        }
        .metric {
          padding: 18px;
        }
        .metric-value {
          font-size: 24px;
        }
        .toolbar select {
          max-width: none;
          flex: 1;
        }
        .catalog-grid {
          grid-template-columns: 1fr 1fr;
        }
        .product-meta {
          padding: 14px;
        }
        .dialog-body {
          padding: 20px;
        }
        .priority-row {
          gap: 9px;
        }
        .priority-row .button {
          font-size: 10px;
          padding: 7px;
        }
        .priority-icon {
          display: none;
        }
      }
      @media (max-width: 420px) {
        .board {
          grid-template-columns: 1fr;
        }
        .catalog-grid {
          grid-template-columns: 1fr;
        }
        .topbar-name strong {
          font-size: 11px;
        }
        .icon-button {
          min-width: 36px;
          height: 36px;
        }
        .tools {
          gap: 6px;
        }
        .metric-value {
          font-size: 23px;
        }
        .metric-label {
          font-size: 10px;
        }
        .metric-label svg {
          display: none;
        }
        .panel-pad {
          padding: 18px;
        }
        .preview-products {
          grid-template-columns: 1fr;
        }
        .priority-row p {
          max-width: 180px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
      .topbar-name {
        min-width: 0;
      }
      .topbar-name strong {
        min-width: 0;
        max-width: 260px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .note-list {
        overflow-wrap: anywhere;
      }
      @media (max-width: 420px) {
        .topbar-name strong {
          max-width: 135px;
        }
      }
    </style>
  </head>
  <body>
    <div id="mobile-backdrop"></div>
    <div class="app">
      <aside
        class="sidebar"
        id="sidebar"
        aria-label="Menú del Centro de tienda"
      >
        <div class="brand">
          <div class="brand-mark" data-icon="bag"></div>
          <div>
            <strong>Centro de tienda</strong><small>Negocio de ejemplo</small>
          </div>
        </div>
        <nav id="navigation" aria-label="Secciones administrativas"></nav>

        card: "M3 5h18v14H3z M3 10h18 M7 15h3",

          "M3 6h11v12H3z M14 10h4l3 4v4h-7 M7 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6 M18 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6",

        paint: "M4 4h16v9H4z M7 13v4h5v5 M20 7h2v7H12",

        arrow: "M5 12h14 M14 7l5 5-5 5",

      const icon = (name) =>

      const esc = (value) =>
        String(value).replace(

          (char) =>

              "&": "&amp;",
              "<": "&lt;",

        );
      const money = (value) =>
        new Intl.NumberFormat("es-PE", {
          style: "currency",
          currency: "PEN",
        }).format(value);
      const orders = [
        {
          id: "DEMO-001",
          customer: "Cliente de ejemplo A",
          payment: "UNDER_REVIEW",
          status: "PENDING_PAYMENT",
          fulfillment: "UNFULFILLED",
          shipping: "Retiro",
          method: "Yape",
          total: 128.5,
          time: "Hace 8 min",
        },
        {
          id: "DEMO-002",
          customer: "Cliente de ejemplo B",
          payment: "PAID",
          status: "CONFIRMED",
          fulfillment: "PREPARING",
          shipping: "Delivery",
          method: "Transferencia",
          total: 246,
          time: "Hace 25 min",
        },
        {
          id: "DEMO-003",
          customer: "Cliente de ejemplo C",
          payment: "PAID",
          status: "CONFIRMED",
          fulfillment: "READY_FOR_PICKUP",
          shipping: "Retiro",
          method: "Yape",
          total: 87.9,
          time: "Hace 42 min",
        },
        {
          id: "DEMO-004",
          customer: "Cliente de ejemplo D",
          payment: "PENDING",
          status: "PENDING_PAYMENT",
          fulfillment: "UNFULFILLED",
          shipping: "Retiro",
          method: "Efectivo al retirar",
          cash: true,
          total: 64,
          time: "Hace 1 h",
        },
        {
          id: "DEMO-005",
          customer: "Cliente de ejemplo E",
          payment: "PAID",
          status: "REVIEW_REQUIRED",
          fulfillment: "UNFULFILLED",
          shipping: "Delivery",
          method: "Mercado Pago",
          total: 159,
          time: "Hace 2 h",
        },
        {
          id: "DEMO-006",
          customer: "Cliente de ejemplo F",
          payment: "PAID",
          status: "COMPLETED",
          fulfillment: "DELIVERED",
          shipping: "Delivery",
          method: "Mercado Pago",
          total: 312.4,
          time: "Hace 3 h",
        },
      ];
      const labels = {
        UNDER_REVIEW: "Por revisar",
        PENDING: "Pendiente",
        PAID: "Pagado",
        PENDING_PAYMENT: "Pendiente de pago",
        CONFIRMED: "Confirmado",
        REVIEW_REQUIRED: "Requiere conciliación",
        COMPLETED: "Completado",
        UNFULFILLED: "Sin preparar",
        PREPARING: "Preparando",
        READY_FOR_PICKUP: "Listo para retirar",
        SHIPPED: "En ruta",
        DELIVERED: "Entregado",
      };
      const sections = [
        ["resumen", "Resumen", "grid"],
        ["pedidos", "Pedidos", "bag"],
        ["pagos", "Pagos", "card"],
        ["entregas", "Entregas", "truck"],
        ["catalogo", "Catálogo", "box"],
        ["clientes", "Clientes", "users"],
        ["apariencia", "Apariencia", "paint"],
        ["configuracion", "Configuración", "settings"],
      ];
      const state = {
        section: "resumen",
        view: "list",
        query: "",
        payment: "",
        storeName: "Tienda de ejemplo",
        previewMobile: false,
      };
      const notes = new Map();
      const queue = (order) =>
        order.payment === "UNDER_REVIEW" || order.status === "REVIEW_REQUIRED"
          ? "review"
          : order.status === "COMPLETED"
            ? null
            : order.fulfillment === "UNFULFILLED" &&
                (order.payment === "PAID" || order.cash)
              ? "prepare"
              : order.fulfillment === "PREPARING"
                ? "preparing"
                : ["READY_FOR_PICKUP", "SHIPPED"].includes(order.fulfillment)
                  ? "delivery"
                  : null;
      const badge = (value, warning = false) =>
        `<span class="badge ${warning ? "warning" : ""}">${esc(labels[value] || value)}</span>`;
      const footer = () =>
        '<footer class="footer"><span>Prototipo de interacción · Estado solo en memoria</span><span>Sin conexión a datos del sistema</span></footer>';
      function announce(text) {
        document.getElementById("announcer").textContent = text;
      }
      function navigation() {
        document.getElementById("navigation").innerHTML = sections
          .map(
            ([id, label, glyph], index) =>
              `${index === 0 ? '<p class="nav-group">Operación</p>' : index === 4 ? '<p class="nav-group">Tienda</p>' : index === 7 ? '<p class="nav-group">Administración</p>' : ""}<button class="nav-link" data-section="${id}" ${state.section === id ? 'aria-current="page"' : ""}>${icon(glyph)}<span>${label}</span>${id === "pagos" ? '<span class="nav-count">2</span>' : id === "pedidos" ? '<span class="nav-count">6</span>' : ""}</button>`,
          )
          .join("");
      }
      function heading(title, subtitle, actions = "") {
        return `<div class="page-heading"><div><p class="eyebrow">${esc(state.storeName)} · Administración</p><h1>${title}</h1><p class="muted">${subtitle}</p></div><div class="heading-actions">${actions || '<button class="button" data-preview>Abrir tienda ' + icon("arrow") + "</button>"}</div></div>`;
      }
      function dashboard() {
        const priority = orders.filter((order) => queue(order) === "review");
        return (
          heading(
            "Tu tienda, de un vistazo",
            "Empieza por lo que necesita tu atención.",
          ) +
          `<div class="metrics"><article class="panel metric"><div class="metric-label">Pedidos de muestra ${icon("bag")}</div><p class="metric-value">${orders.length}</p><small>Conjunto ficticio completo</small></article><article class="panel metric"><div class="metric-label">Ventas confirmadas · demo ${icon("card")}</div><p class="metric-value">${money(orders.filter((order) => order.status === "CONFIRMED" || order.status === "COMPLETED").reduce((sum, order) => sum + order.total, 0))}</p><small>No representa flujo de caja real</small></article><article class="panel metric"><div class="metric-label">Pagos por revisar ${icon("clock")}</div><p class="metric-value">${priority.length}</p><small>Comprobante o conciliación</small></article><article class="panel metric"><div class="metric-label">Listos para entregar ${icon("truck")}</div><p class="metric-value">${orders.filter((order) => queue(order) === "delivery").length}</p><small>Retiro y despacho</small></article></div><div class="dashboard-grid"><section class="panel panel-pad"><div class="section-heading"><h2>Prioridad de hoy</h2><button class="button" data-section="pedidos">Ver pedidos ${icon("arrow")}</button></div>${priority.map((order) => `<div class="priority-row"><div class="priority-icon">${icon("card")}</div><div><strong>${order.id}</strong><p>${order.status === "REVIEW_REQUIRED" ? "Pago tardío por conciliar" : "Comprobante pendiente de revisión"} · ${money(order.total)}</p></div><button class="button" data-order="${order.id}">Revisar</button></div>`).join("")}<div class="section-heading" style="margin-top:30px"><h2>Actividad ilustrativa</h2><small>No es una serie real</small></div><div class="bars" aria-label="Gráfico ilustrativo de siete días">${[40, 70, 54, 92, 65, 100, 84].map((height) => `<div class="bar" style="height:${height}%"></div>`).join("")}</div><p class="muted" style="font-size:10px">La implementación consultará agregados por día de la compañía.</p></section><section class="panel panel-pad"><div class="section-heading"><h2>Lo último en tu tienda</h2></div><ol class="timeline"><li>Un comprobante espera revisión<small>Demostración · Pedido DEMO-001</small></li><li>Una compra está en preparación<small>Demostración · Pedido DEMO-002</small></li><li>Un retiro está listo<small>Demostración · Pedido DEMO-003</small></li></ol><div style="border-top:1px solid var(--line);padding-top:20px"><p class="eyebrow">Tu espacio comercial</p><h3 style="margin:10px 0">Una identidad para tu negocio</h3><p class="muted" style="font-size:12px;margin-bottom:16px">Prueba el editor de apariencia antes de implementar la publicación.</p><button class="button" data-section="apariencia">Explorar apariencia ${icon("arrow")}</button></div></section></div>` +
          footer()
        );
      }
      function filteredOrders() {
        return orders.filter(
          (order) =>
            (state.section !== "pagos" || queue(order) === "review") &&
            (state.section !== "entregas" ||
              ["prepare", "preparing", "delivery"].includes(queue(order))) &&
            order.id.toLowerCase().includes(state.query.toLowerCase()) &&
            (!state.payment || order.payment === state.payment),
        );
      }
      function orderResults() {
        const data = filteredOrders();
        document.getElementById("result-count").textContent =
          `${data.length} pedidos de demostración`;
        document.getElementById("order-results").innerHTML =
          state.view === "board"
            ? `<div class="board">${[
                ["review", "Por revisar"],
                ["prepare", "Por preparar"],
                ["preparing", "En preparación"],
                ["delivery", "Listo / en ruta"],
              ]
                .map(
                  ([key, title]) =>
                    `<section class="board-column"><h3>${title}<span>${data.filter((order) => queue(order) === key).length}</span></h3>${
                      data
                        .filter((order) => queue(order) === key)
                        .map(
                          (order) =>
                            `<button class="order-card" data-order="${order.id}"><strong>${order.id}</strong><br>${badge(order.payment, order.payment === "UNDER_REVIEW")}<p><span>${order.shipping}</span><b>${money(order.total)}</b></p></button>`,
                        )
                        .join("") || '<p class="empty">Sin pendientes</p>'
                    }</section>`,
                )
                .join("")}</div>`
            : `<div class="panel table-scroll"><table><caption class="sr-only">Pedidos de demostración filtrados</caption><thead><tr><th>Número</th><th>Cliente</th><th>Pago</th><th>Entrega</th><th>Total</th><th>Antigüedad</th></tr></thead><tbody>${data.map((order) => `<tr><td><button class="table-link" data-order="${order.id}">${order.id}</button></td><td>${order.customer}</td><td>${badge(order.payment, order.payment === "UNDER_REVIEW")}</td><td>${esc(labels[order.fulfillment])}</td><td>${money(order.total)}</td><td class="muted">${order.time}</td></tr>`).join("") || '<tr><td colspan="6" class="empty">No hay coincidencias. Cambia el filtro.</td></tr>'}</tbody></table></div>`;
      }
      function ordersPage() {
        const title = sections.find(
          (section) => section[0] === state.section,
        )[1];
        return (
          heading(
            title,
            "Bandejas separadas, con el mismo detalle de compra.",
          ) +
          `<div class="toolbar"><label class="search">${icon("search")}<input id="order-search" aria-label="Buscar pedido por número" placeholder="Buscar por número de pedido" maxlength="80" value="${esc(state.query)}"></label><select id="payment-filter" aria-label="Filtrar pago"><option value="">Todos los pagos</option><option value="UNDER_REVIEW" ${state.payment === "UNDER_REVIEW" ? "selected" : ""}>Por revisar</option><option value="PAID" ${state.payment === "PAID" ? "selected" : ""}>Pagados</option><option value="PENDING" ${state.payment === "PENDING" ? "selected" : ""}>Pendientes</option></select><div class="segmented" aria-label="Vista de pedidos"><button data-view="list" aria-pressed="${state.view === "list"}">Lista</button><button data-view="board" aria-pressed="${state.view === "board"}">Tablero</button></div></div><p id="result-count" class="result-meta"></p><div id="order-results"></div><p class="preview-note">El tablero agrupa tareas. Ninguna tarjeta modifica estados o confirma cobros.</p>` +
          footer()
        );
      }
      function preview() {
        return `<div class="preview ${state.previewMobile ? "mobile" : ""}" id="store-preview"><div class="preview-top" id="preview-name">${esc(state.storeName)}</div><div class="preview-body"><p class="eyebrow">Tu selección</p><h2>Encuentra tu próximo favorito.</h2><p>Una muestra de la identidad de tu tienda, con la paleta actual.</p><div class="preview-products"><div class="preview-product">${icon("box")}Café de ejemplo<b>S/ 24.00</b></div><div class="preview-product">${icon("box")}Pack de ejemplo<b>S/ 48.00</b></div></div></div></div>`;
      }
      function appearance() {
        return (
          heading(
            "Diseña tu espacio",
            "Previsualiza primero. Publica solo cuando esté revisado.",
          ) +
          `<div class="settings-grid"><section class="panel panel-pad"><h2 style="margin-bottom:24px">Identidad y presentación</h2><div class="field"><label for="store-name">Nombre en la vista de demostración</label><input id="store-name" maxlength="100" value="${esc(state.storeName)}"><small>Solo cambia este prototipo; el sistema conservará la identidad canónica.</small></div><div class="field"><label for="theme-preset">Paleta</label><select id="theme-preset"><option>Petróleo y crema</option></select><small>Presets acotados, con contraste revisado.</small></div><div class="option">${icon("paint")}<div><h3>Logo y portada</h3><p>La implementación usará medios de la compañía y versiones de borrador/publicación.</p></div></div><button class="button primary" id="save-draft">Simular guardado de borrador</button><p class="status-line" id="draft-status" role="status"></p></section><section><div class="section-heading"><h2>Vista previa</h2><div class="segmented"><button data-preview-mode="desktop" aria-pressed="${!state.previewMobile}">Escritorio</button><button data-preview-mode="mobile" aria-pressed="${state.previewMobile}">Móvil</button></div></div>${preview()}<p class="preview-note">Datos de muestra. No hay subida, guardado remoto ni publicación real.</p></section></div>` +
          footer()
        );
      }
      function configuration() {
        return (
          heading(
            "Configura la compra",
            "Cada opción debe coincidir con lo que ofrece tu compañía.",
          ) +
          `<div class="settings-grid"><section class="panel panel-pad"><h2>Formas de entrega</h2><div class="option">${icon("bag")}<div><h3>Retiro en local</h3><p>Av. de ejemplo 123 · Dirección ficticia</p><span class="badge">Habilitado · muestra</span></div><b>Gratis</b></div><div class="option">${icon("truck")}<div><h3>Entrega local</h3><p>Cobertura de ejemplo: ubigeo 150101</p><span class="badge">Habilitado · muestra</span></div><b>S/ 5.00</b></div><p class="preview-note">Los pedidos históricos conservan su snapshot de entrega.</p></section><section class="panel panel-pad"><h2>Formas de pago</h2><div class="option">${icon("card")}<div><h3>Yape / transferencia</h3><p>Instrucciones del negocio y revisión de comprobante.</p></div></div><div class="option">${icon("bag")}<div><h3>Efectivo al retirar</h3><p>Disponible solo para retiro. Se cobra antes de entregar.</p></div></div><div class="option">${icon("settings")}<div><h3>Integraciones</h3><p>La configuración real solo mostrará estado y comercio; no devolverá secretos al navegador.</p></div></div></section></div>` +
          footer()
        );
      }
      function catalog() {
        return (
          heading(
            "Tu selección de productos",
            "Publicar en tienda es distinto de modificar el inventario.",
          ) +
          `<div class="catalog-grid">${[
            ["Café de ejemplo", 24],
            ["Pack de ejemplo", 48],
            ["Selección de ejemplo", 32],
          ]
            .map(
              ([name, price]) =>
                `<article class="panel"><div class="product-placeholder" aria-label="Imagen ilustrativa">${icon("box")}</div><div class="product-meta"><h3>${name}</h3><div><strong>${money(price)}</strong><span class="badge">Publicado · demo</span></div><p class="preview-note">La implementación reutiliza Product y sus presentaciones.</p></div></article>`,
            )
            .join("")}</div>` +
          footer()
        );
      }
      function customers() {
        return (
          heading(
            "Clientes de tu tienda",
            "Cuentas comerciales separadas por compañía.",
          ) +
          `<div class="panel table-scroll"><table><caption class="sr-only">Cuentas comerciales ficticias</caption><thead><tr><th>Cuenta de ejemplo</th><th>Estado comercial</th><th>Datos protegidos</th></tr></thead><tbody>${orders
            .slice(0, 4)
            .map(
              (order) =>
                `<tr><td>${order.customer}</td><td><span class="badge">Activa · demo</span></td><td class="muted">Sin documentos o direcciones en el listado</td></tr>`,
            )
            .join(
              "",
            )}</tbody></table></div><p class="preview-note">Suspender una cuenta de esta tienda no desactiva al usuario global.</p>` +
          footer()
        );
      }
      function render() {
        navigation();
        document.getElementById("topbar-store").textContent = state.storeName;
        document.title = `${sections.find((section) => section[0] === state.section)[1]} · Centro de tienda (prototipo)`;
        const root = document.getElementById("main-content");
        root.innerHTML =
          state.section === "resumen"
            ? dashboard()
            : ["pedidos", "pagos", "entregas"].includes(state.section)
              ? ordersPage()
              : state.section === "apariencia"
                ? appearance()
                : state.section === "configuracion"
                  ? configuration()
                  : state.section === "catalogo"
                    ? catalog()
                    : customers();
        if (["pedidos", "pagos", "entregas"].includes(state.section))
          orderResults();
      }
      function setSection(section) {
        if (!sections.some((item) => item[0] === section)) return;
        state.section = section;
        state.query = "";
        state.payment = "";
        history.replaceState(null, "", `#${section}`);
        closeMenu();
        render();
        announce(`Sección ${sections.find((item) => item[0] === section)[1]}`);
        window.scrollTo(0, 0);
      }
      function closeMenu() {
        document.getElementById("sidebar").classList.remove("open");
        document.getElementById("mobile-backdrop").classList.remove("open");
        document
          .getElementById("menu-toggle")
          .setAttribute("aria-expanded", "false");
      }
      function openDetail(id) {
        const order = orders.find((item) => item.id === id);
        if (!order) return;
        document.getElementById("detail-title").textContent = order.id;
        document.getElementById("detail-body").innerHTML =
          `<div style="display:flex;flex-wrap:wrap;gap:8px">${badge(order.status, order.status === "REVIEW_REQUIRED")}${badge(order.payment, order.payment === "UNDER_REVIEW")}${badge(order.fulfillment)}</div><div class="detail-grid"><div><p class="eyebrow">Resumen</p><h2 style="margin:10px 0">${money(order.total)}</h2><p class="muted">Compra ficticia para demostrar el detalle enlazable.</p><p style="margin-top:18px;font-size:12px">Pago: ${order.method}<br>Entrega: ${order.shipping}</p></div><div><p class="eyebrow">Siguiente tarea</p><p style="margin-top:10px">${order.status === "REVIEW_REQUIRED" ? "Conciliar el pago tardío con el estado de la reserva." : order.payment === "UNDER_REVIEW" ? "Revisar el comprobante y verificar el cobro." : order.cash ? "Preparar dentro de la reserva y cobrar antes de entregar." : "Revisar los comandos permitidos del pedido."}</p></div></div><div class="option"><p class="muted">Esta demostración no registra cobros ni modifica pedidos. Los comandos reales se validan en el servidor.</p></div><h3>Notas internas · solo demostración</h3><ul class="note-list" id="note-list"></ul><form id="note-form" data-id="${order.id}"><label for="internal-note" class="sr-only">Nota interna de demostración</label><textarea id="internal-note" name="note" maxlength="2000" required placeholder="Añade una nota de muestra para el equipo"></textarea><button class="button" style="margin-top:10px">Añadir nota de muestra</button></form>`;
        renderNotes(order.id);
        document.getElementById("detail-dialog").showModal();
      }
      function renderNotes(id) {
        const list = document.getElementById("note-list");
        list.replaceChildren();
        for (const text of notes.get(id) || []) {
          const item = document.createElement("li");
          item.textContent = text;
          list.appendChild(item);
        }
      }
      document.addEventListener("click", (event) => {
        const section = event.target.closest("[data-section]");
        if (section) setSection(section.dataset.section);
        const order = event.target.closest("[data-order]");
        if (order) openDetail(order.dataset.order);
        const view = event.target.closest("[data-view]");
        if (view) {
          state.view = view.dataset.view;
          render();
        }
        const mode = event.target.closest("[data-preview-mode]");
        if (mode) {
          state.previewMobile = mode.dataset.previewMode === "mobile";
          render();
        }
        if (event.target.closest("[data-preview]")) {
          document.getElementById("detail-title").textContent =
            "Vista pública simulada";
          document.getElementById("detail-body").innerHTML =
            preview() +
            '<p class="preview-note">En el sistema, este acceso abrirá /tienda/:slug con su sesión comercial correspondiente.</p>';
          document.getElementById("detail-dialog").showModal();
        }
        if (event.target.closest("#save-draft"))
          document.getElementById("draft-status").textContent =
            "Borrador de demostración guardado en memoria. No se publicó ningún cambio.";
      });
      document.addEventListener("input", (event) => {
        if (event.target.id === "order-search") {
          state.query = event.target.value;
          orderResults();
        }
        if (event.target.id === "store-name") {
          state.storeName = event.target.value.trim() || "Tienda de ejemplo";
          document.getElementById("topbar-store").textContent = state.storeName;
          document.getElementById("preview-name").textContent = state.storeName;
        }
      });
      document.addEventListener("change", (event) => {
        if (event.target.id === "payment-filter") {
          state.payment = event.target.value;
          orderResults();
        }
      });
      document.addEventListener("submit", (event) => {
        if (event.target.id !== "note-form") return;
        event.preventDefault();
        const text = new FormData(event.target).get("note").trim();
        if (!text) return;
        const id = event.target.dataset.id;
        notes.set(id, [...(notes.get(id) || []), text]);
        renderNotes(id);
        event.target.reset();
        announce("Nota añadida solo en esta demostración");
      });
      document.getElementById("menu-toggle").addEventListener("click", () => {
        const open = document
          .getElementById("sidebar")
          .classList.toggle("open");
        document
          .getElementById("mobile-backdrop")
          .classList.toggle("open", open);
        document
          .getElementById("menu-toggle")
          .setAttribute("aria-expanded", String(open));
      });
      document
        .getElementById("mobile-backdrop")
        .addEventListener("click", closeMenu);
      document.getElementById("theme-toggle").addEventListener("click", () => {
        document.body.dataset.theme =
          document.body.dataset.theme === "dark" ? "light" : "dark";
        announce("Tema cambiado");
      });
      document
        .getElementById("notifications")
        .addEventListener("click", () => setSection("pagos"));
      document
        .getElementById("close-dialog")
        .addEventListener("click", () =>
          document.getElementById("detail-dialog").close(),
        );
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeMenu();
      });
      for (const element of document.querySelectorAll("[data-icon]"))
        element.innerHTML = icon(element.dataset.icon);
      const initial = location.hash.slice(1);
      if (sections.some((section) => section[0] === initial))
        state.section = initial;
      render();
    </script>
  </body>
</html>
