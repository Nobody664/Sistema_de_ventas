services:
  - type: web
    runtime: node
    name: sistema-de-ventas-backend
    rootDir: backend
    region: oregon
    buildCommand: bash scripts/build.sh
    startCommand: bash start.sh
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: REDIS_URL
        sync: false
      - key: SMTP_ENABLED
        value: "false"
